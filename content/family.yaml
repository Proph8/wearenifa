name: Nifa
intro: >-
  We are Nifa: Nisham and Fazna. He builds AI products for businesses; she
  makes AI work inside one. We write essays, poems and articles, and keep our
  work here.
heroPhoto: /media/family/hillside.jpg
heroPhotoAlt: Nisham and Fazna sitting on a green hillside with hills behind them, laughing
places: Two people, one name, and the places we keep going back to.
